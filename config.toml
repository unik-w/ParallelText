# Paralleltext Configuration File
# Configure your remote services and processing preferences

[ollama]
# Remote Ollama server configuration
host = "192.168.178.88"  # Replace with your remote server IP
port = 11434
timeout = 30

# Preferred embedding model (will fallback to available models if not found)
model = "snowflake-arctic-embed2"

# Alternative models to try if preferred model is not available
fallback_models = [
    "nomic-embed-text",
    "mxbai-embed-large", 
    "all-minilm"
]

[chunking]
# Text chunking configuration for semantic alignment
max_chunk_size = 1000
max_sentences_per_chunk = 10
overlap_sentences = 0

# Batch processing settings
batch_size = 5
max_concurrent = 3

[alignment]
# Alignment processing preferences
similarity_threshold = 0.3  # Reasonable threshold for cross-language
fallback_to_naive = true

# Enable debug output for alignment process
debug = false
