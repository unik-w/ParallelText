[project]
authors = ["Akhil <akhil.sathuluri@tum.de>"]
name = "paralleltext"
description = "Build parallel bilingual EPUBs"
channels = ["conda-forge"]
platforms = ["linux-64"]
version = "0.1.0"

[tasks]
ptd = "python -m paralleltext"
merge = "python -m paralleltext merge --src fixtures/de.epub --tgt fixtures/en.epub --out fixtures/kafka_parallel.epub"
make-fixtures = "python tools/make_fixtures.py --de ./tests/data/Der_Prozess_full.epub --en ./tests/data/The_Trial_full.epub --out tests/data"
test = "pytest -q"

[dependencies]
python = "3.12.*"
beautifulsoup4 = ">=4.13.5,<5"
lxml = ">=6.0.1,<7"
click = ">=8.2.1,<9"
pytest = ">=8.4.1,<9"
ebooklib = ">=0.17,<0.18"
typer = ">=0.17.3,<0.18"
pillow = ">=11.3.0,<12"
